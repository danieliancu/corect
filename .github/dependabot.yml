# Weekly dependency updates. Patch and minor versions are grouped into one PR per ecosystem; major versions get their
# own PRs for a careful review. Nothing merges automatically: the "tests" workflow must pass and a person merges.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: [dependencies]
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
