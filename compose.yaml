name: englishcoach
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-englishcoach}
      POSTGRES_USER: ${DATABASE_USER:-englishcoach}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-englishcoach-local}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
