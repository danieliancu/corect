{% extends 'base.html' %}{% block title %}Your profile — Corect.uk{% endblock %}{% block content %}
<section class="auth-container">
  <div class="page-heading"><p class="eyebrow">YOUR NEXT SMALL STEP</p><h1>Your profile</h1><p>Signed in as {{ username }}</p></div>
  <form method="post" class="card account-form">{% csrf_token %}
    <input type="hidden" name="action" value="profile">
    <h2>Account details</h2>
    {{ profile_form.as_p }}
    <button class="button" type="submit">Save changes</button>
  </form>
  <form method="post" class="card account-form">{% csrf_token %}
    <input type="hidden" name="action" value="password">
    <h2>Change password</h2>
    {{ password_form.as_p }}
    <button class="button" type="submit">Change password</button>
  </form>
</section>
{% endblock %}
