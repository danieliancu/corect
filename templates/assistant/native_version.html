{% load assistant_ui %}{% if result.native_text %}
<section class="native-version" aria-label="Cum ar spune un vorbitor nativ">
  <div class="native-version-heading"><h3>Versiunea nativă</h3><span>Engleză britanică</span></div>
  <div class="spoken-sentence"><p class="native-sentence" lang="en-GB">{{ result.native_text }}</p>{% speech_button result.native_text "native" %}</div>
  {% if result.native_explanation %}<p class="native-explanation" lang="ro">{{ result.native_explanation }}</p>{% endif %}
</section>
{% endif %}
