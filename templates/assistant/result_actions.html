<div id="result-actions" class="result-actions"{% if oob %} hx-swap-oob="true"{% endif %}{% if not result or kind != 'correction' or error %} hidden{% endif %}>
  {% if result and kind == 'correction' and not error %}
    <a class="button secondary" href="{% url 'home' %}" data-new-correction>New correction</a>
    {% if not user.is_authenticated %}<a class="button" href="{% url 'login' %}" data-sign-in>Sign in / Create account</a>{% endif %}
  {% endif %}
</div>
