<div id="result-actions" class="result-actions"{% if oob %} hx-swap-oob="true"{% endif %}{% if not result or error %} hidden{% elif kind != 'correction' and kind != 'translation' %} hidden{% endif %}>
  {% if result and not error %}{% if kind == 'correction' or kind == 'translation' %}
    <a class="button secondary" href="{% url 'home' %}" data-new-correction>Corectură nouă</a>
    {% if not user.is_authenticated %}<a class="button" href="{% url 'login' %}" data-sign-in>Autentificare / Creează cont</a>{% endif %}
  {% endif %}{% endif %}
</div>
