<form method="post" action="{% url 'resend_verification' %}" class="resend-form" aria-labelledby="resend-title">{% csrf_token %}<h2 id="resend-title">Nu ai primit emailul?</h2><p class="muted">Verifică și dosarul Spam. Poți cere un link nou o dată la câteva minute.</p><p><label for="id_resend_email">Adresa ta de email</label><input type="email" name="email" id="id_resend_email" maxlength="254" autocomplete="email" required></p><button class="button secondary" type="submit">Trimite din nou linkul</button></form>
